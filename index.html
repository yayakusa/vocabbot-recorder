<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VocabBot Speaking Recorder</title>
<style>
:root{--p:#6D5DFB;--bg:#F7F6FF;--card:#fff;--text:#2D2A3A;--soft:#EEEAFE;--ok:#168B50;--bad:#C73D4D}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#6D5DFB,#9386FF);color:#fff;border-radius:24px;padding:22px;text-align:center}
.card{background:#fff;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 8px 28px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
button,select{padding:12px;border-radius:13px;font-size:16px;border:0}button{cursor:pointer}.primary{background:var(--p);color:#fff}.soft{background:var(--soft);color:#3B3460}.wide{width:100%}
.mission{background:#fff;border:1px solid #e8e5ef;text-align:left}.mission b{display:block}
.wordbox{text-align:center;padding:24px}.word{font-size:38px;font-weight:700;color:var(--p)}.thai{font-size:23px;font-weight:700}
.status{background:#FAF9FF;border:1px solid #e9e6f2;border-radius:14px;padding:13px;margin:12px 0}.recording{color:var(--bad);font-weight:700}
audio{width:100%;margin-top:10px}.hidden{display:none}.student{opacity:.9;font-size:14px}.good{color:var(--ok);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
.notice{background:#FFF8E7;padding:12px;border-radius:12px;font-size:14px;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div style="font-size:54px">🎙️</div>
    <h1>VocabBot Speaking Recorder</h1>
    <div id="studentInfo" class="student"></div>
    <button class="soft" style="margin-top:14px" onclick="returnToVocabBot()">← กลับไปทำแบบฝึกใน VocabBot</button>
  </div>

  <div id="errorCard" class="card hidden">
    <h2>⚠️ เปิด Recorder ไม่สำเร็จ</h2>
    <p id="errorText"></p>
  </div>

  <div id="missionCard" class="card">
    <h2>เลือก Mission</h2>
    <p>แต่ละ Mission ใช้ 5 คำสำคัญสำหรับ Speaking Evidence</p>
    <div id="missions" class="grid"></div>
  </div>

  <div id="recordCard" class="card hidden">
    <h2 id="title">Speaking Practice</h2>
    <div id="wordBox"></div>

    <label><b>ประเภทหลักฐาน</b></label>
    <select id="attemptType" class="wide">
      <option value="Before">Before Practice</option>
      <option value="Practice" selected>Practice</option>
      <option value="After">After Practice</option>
    </select>

    <div id="status" class="status">พร้อมอัดเสียง</div>

    <div class="row">
      <button id="recordBtn" class="primary" onclick="startRecording()">🎙 Record</button>
      <button id="stopBtn" class="soft" onclick="stopRecording()" disabled>⏹ Stop</button>
    </div>

    <audio id="preview" controls class="hidden"></audio>
    <button id="saveBtn" class="primary wide hidden" style="margin-top:10px" onclick="saveRecording()">💾 Save to VocabBot</button>

    <div class="row" style="margin-top:12px">
      <button class="soft" onclick="prevWord()">← Previous</button>
      <button class="soft" onclick="nextWord()">Next →</button>
    </div>
    <button class="soft wide" style="margin-top:10px" onclick="backToMissions()">← Mission Menu</button>
    <button class="primary wide" style="margin-top:10px" onclick="returnToVocabBot()">← กลับไปทำแบบฝึกใน VocabBot</button>

    <div class="notice" style="margin-top:14px">
      อัดได้สูงสุดประมาณ 10 วินาทีต่อคำ • ฟังเสียงตัวเองก่อน Save ได้ •
      ไฟล์จะส่งกลับไปยัง Google Drive ของ VocabBot
    </div>
  </div>

  <iframe id="submitFrame" name="submitFrame" class="hidden"></iframe>
</div>

<form id="uploadForm" method="POST" target="submitFrame" class="hidden">
  <input name="action" value="saveExternalRecording">
  <input id="fStudentId" name="studentId">
  <input id="fName" name="name">
  <input id="fClassName" name="className">
  <input id="fNo" name="no">
  <input id="fTs" name="ts">
  <input id="fSig" name="sig">
  <input id="fMission" name="mission">
  <input id="fWord" name="word">
  <input id="fAttemptType" name="attemptType">
  <input id="fDuration" name="durationSec">
  <input id="fMimeType" name="mimeType">
  <textarea id="fAudio" name="audioBase64"></textarea>
</form>

<script>
const VOCAB = {
1:{name:'School Life',emoji:'🏫',words:[['subject','วิชา','English is my favorite subject.'],['classroom','ห้องเรียน','The students are in the classroom.'],['library','ห้องสมุด','I read books in the library.'],['homework','การบ้าน','I do my homework after school.'],['uniform','เครื่องแบบ','Students wear a school uniform.']]},
2:{name:'Daily Routine',emoji:'⏰',words:[['wake up','ตื่นนอน','I wake up at six o’clock.'],['brush','แปรง','I brush my teeth every morning.'],['breakfast','อาหารเช้า','I eat breakfast before school.'],['arrive','มาถึง','We arrive at school at 7:30.'],['leave','ออกจาก','I leave home at seven o’clock.']]},
3:{name:'Family & People',emoji:'👨‍👩‍👧',words:[['parents','พ่อแม่','My parents work in Songkhla.'],['cousin','ลูกพี่ลูกน้อง','My cousin is twelve years old.'],['neighbor','เพื่อนบ้าน','Our neighbor is very friendly.'],['friendly','เป็นมิตร','She is friendly to everyone.'],['helpful','ชอบช่วยเหลือ','Tom is a helpful student.']]},
4:{name:'Food & Shopping',emoji:'🛒',words:[['vegetable','ผัก','Carrots are vegetables.'],['fruit','ผลไม้','Mango is my favorite fruit.'],['bottle','ขวด','I need a bottle of water.'],['kilogram','กิโลกรัม','We bought one kilogram of apples.'],['price','ราคา','What is the price of this bag?']]},
5:{name:'Places & Directions',emoji:'🗺️',words:[['bank','ธนาคาร','The bank is next to the market.'],['hospital','โรงพยาบาล','She works at the hospital.'],['post office','ที่ทำการไปรษณีย์','I sent the parcel at the post office.'],['market','ตลาด','We buy vegetables at the market.'],['station','สถานี','Meet me at the train station.']]},
6:{name:'Travel & Transport',emoji:'✈️',words:[['airport','สนามบิน','We arrived at the airport early.'],['ticket','ตั๋ว','Please show me your ticket.'],['passenger','ผู้โดยสาร','All passengers must wear seat belts.'],['luggage','สัมภาระ','My luggage is very heavy.'],['journey','การเดินทาง','The journey took three hours.']]},
7:{name:'Weather & Clothes',emoji:'🌦️',words:[['sunny','มีแดด','It is sunny today.'],['cloudy','มีเมฆ','The sky is cloudy.'],['rainy','ฝนตก','It is rainy in the afternoon.'],['windy','มีลมแรง','It is windy near the sea.'],['stormy','มีพายุ','The weather is stormy tonight.']]},
8:{name:'Health & Safety',emoji:'🏥',words:[['headache','ปวดศีรษะ','I have a headache.'],['fever','ไข้','He has a high fever.'],['medicine','ยา','Take this medicine after meals.'],['doctor','แพทย์','You should see a doctor.'],['dentist','ทันตแพทย์','The dentist checks my teeth.']]},
9:{name:'Signs & Public Places',emoji:'🚦',words:[['entrance','ทางเข้า','Use the main entrance.'],['exit','ทางออก','The exit is on the left.'],['open','เปิด','The shop is open now.'],['closed','ปิด','The museum is closed today.'],['stop','หยุด','Stop at the red light.']]},
10:{name:'Feelings & Communication',emoji:'💬',words:[['happy','มีความสุข','I am happy to see you.'],['excited','ตื่นเต้น','The students are excited about the trip.'],['worried','กังวล','She is worried about the exam.'],['tired','เหนื่อย','I feel tired after running.'],['hungry','หิว','I am hungry. Let’s eat.']]}
};

const q = new URLSearchParams(location.search);
const session = {
  backend:q.get('backend')||'',
  name:q.get('name')||'',
  className:q.get('className')||'',
  no:q.get('no')||'',
  studentId:q.get('studentId')||'',
  ts:q.get('ts')||'',
  sig:q.get('sig')||''
};

let mission=0,index=0,stream=null,recorder=null,chunks=[],blob=null,startAt=0,durationSec=0,timer=null;

function init(){
  document.getElementById('studentInfo').textContent =
    `${session.name} • ${session.className} • เลขที่ ${session.no}`;

  if(!session.backend || !session.studentId || !session.sig){
    showError('กรุณาเปิด Speaking Recorder จากหน้า VocabBot เท่านั้น');
    return;
  }

  document.getElementById('uploadForm').action = session.backend;
  ['StudentId','Name','ClassName','No','Ts','Sig'].forEach(k=>{
    const map={StudentId:'studentId',Name:'name',ClassName:'className',No:'no',Ts:'ts',Sig:'sig'};
    document.getElementById('f'+k).value=session[map[k]];
  });

  document.getElementById('missions').innerHTML=Object.keys(VOCAB).map(k=>{
    const m=VOCAB[k];
    return `<button class="mission" onclick="openMission(${k})"><b>${m.emoji} Mission ${k}</b>${m.name}<br><small>5 speaking words</small></button>`;
  }).join('');
}
function showError(t){document.getElementById('errorCard').classList.remove('hidden');document.getElementById('errorText').textContent=t}
function openMission(n){mission=Number(n);index=0;document.getElementById('missionCard').classList.add('hidden');document.getElementById('recordCard').classList.remove('hidden');render()}
function backToMissions(){cleanup();document.getElementById('recordCard').classList.add('hidden');document.getElementById('missionCard').classList.remove('hidden')}
function render(){
  resetUI(); const m=VOCAB[mission],w=m.words[index];
  document.getElementById('title').textContent=`🎙 ${m.emoji} Mission ${mission} • Word ${index+1}/5`;
  document.getElementById('wordBox').innerHTML=`<div class="wordbox"><div class="word">${w[0]}</div><div class="thai">${w[1]}</div><p>${w[2]}</p><button class="soft" onclick="speak('${esc(w[0])}')">🔊 Listen to Model</button></div>`;
}
function prevWord(){if(index>0){index--;render()}}
function nextWord(){if(index<4){index++;render()}else alert('ครบ 5 คำแล้ว 🎉')}
function speak(t){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1.08;
  const vs=speechSynthesis.getVoices();
  u.voice=vs.find(v=>/Google US English/i.test(v.name))||vs.find(v=>/Samantha/i.test(v.name))||vs.find(v=>/^en-US/i.test(v.lang))||null;
  speechSynthesis.speak(u);
}
function mime(){
  const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(const x of c){try{if(MediaRecorder.isTypeSupported(x))return x}catch(e){}}
  return '';
}
async function startRecording(){
  try{
    cleanup();stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=mime();recorder=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);chunks=[];blob=null;
    recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onstop=()=>{durationSec=Math.max(1,Math.round((Date.now()-startAt)/1000));blob=new Blob(chunks,{type:recorder.mimeType||mt||'audio/webm'});const url=URL.createObjectURL(blob);const a=document.getElementById('preview');a.src=url;a.classList.remove('hidden');document.getElementById('saveBtn').classList.remove('hidden');document.getElementById('status').textContent='✅ อัดเสร็จแล้ว — ฟังเสียงก่อน Save';document.getElementById('recordBtn').disabled=false;document.getElementById('stopBtn').disabled=true;stopTracks()};
    startAt=Date.now();recorder.start();document.getElementById('status').innerHTML='<span class="recording">● กำลังอัดเสียง...</span> สูงสุด 10 วินาที';document.getElementById('recordBtn').disabled=true;document.getElementById('stopBtn').disabled=false;
    timer=setTimeout(()=>{if(recorder&&recorder.state==='recording')recorder.stop()},10000);
  }catch(e){cleanup();alert('ไม่สามารถใช้ไมโครโฟนได้ กรุณาอนุญาต Microphone ให้เว็บไซต์นี้ แล้วลองใหม่')}
}
function stopRecording(){clearTimeout(timer);if(recorder&&recorder.state==='recording')recorder.stop()}
function stopTracks(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function cleanup(){clearTimeout(timer);stopTracks()}
function resetUI(){
  cleanup();blob=null;chunks=[];durationSec=0;
  const a=document.getElementById('preview');a.pause();a.removeAttribute('src');a.classList.add('hidden');
  document.getElementById('saveBtn').classList.add('hidden');document.getElementById('saveBtn').disabled=false;document.getElementById('saveBtn').textContent='💾 Save to VocabBot';
  document.getElementById('recordBtn').disabled=false;document.getElementById('stopBtn').disabled=true;document.getElementById('status').textContent='พร้อมอัดเสียง';
}
function toB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onloadend=()=>{const s=String(r.result||'');res(s.slice(s.indexOf(',')+1))};r.onerror=rej;r.readAsDataURL(b)})}
async function saveRecording(){
  if(!blob)return alert('กรุณาอัดเสียงก่อน');
  const m=VOCAB[mission],w=m.words[index],btn=document.getElementById('saveBtn');
  btn.disabled=true;btn.textContent='⏳ Saving...';
  const b64=await toB64(blob);

  document.getElementById('fMission').value=mission;
  document.getElementById('fWord').value=w[0];
  document.getElementById('fAttemptType').value=document.getElementById('attemptType').value;
  document.getElementById('fDuration').value=durationSec;
  document.getElementById('fMimeType').value=blob.type||'audio/webm';
  document.getElementById('fAudio').value=b64;
  document.getElementById('uploadForm').submit();
}
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.source!=='VocabBotRecorder')return;
  const btn=document.getElementById('saveBtn');
  btn.disabled=false;
  if(d.ok){
    btn.textContent='✅ Saved';
    document.getElementById('status').innerHTML=`<span class="good">✅ บันทึก ${d.word||''} เรียบร้อย</span>`;
    setTimeout(()=>{if(index<4){index++;render()}else{alert('บันทึกครบ 5 คำแล้ว 🎉 กด “กลับไปทำแบบฝึกใน VocabBot” เพื่อเรียนต่อ');backToMissions()}},650);
  }else{
    btn.textContent='💾 Save to VocabBot';
    alert('บันทึกไม่สำเร็จ: '+(d.message||'Unknown error'));
  }
});
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
init();
</script>
</body>
</html>
